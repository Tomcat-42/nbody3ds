name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: nbody3ds
          path: |
            nbody3ds.3dsx
            nbody3ds.smdh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Generate QR code
        run: |
          apt-get update && apt-get install -y qrencode
          TAG="${GITHUB_REF#refs/tags/}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nbody3ds.3dsx"
          qrencode -o qrcode.png -s 6 -m 2 "$URL"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            nbody3ds.3dsx \
            nbody3ds.smdh \
            qrcode.png \
            --title "$TAG" \
            --generate-notes
