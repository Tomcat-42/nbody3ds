name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install CIA tools
        run: |
          apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null
          wget -q "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip" -O /tmp/makerom.zip
          unzip -qo /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom
          wget -q "https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip" -O /tmp/bannertool.zip
          unzip -qo /tmp/bannertool.zip "linux-x86_64/*" -d /tmp
          cp /tmp/linux-x86_64/bannertool /usr/local/bin/
          chmod +x /usr/local/bin/bannertool

      - name: Build
        run: |
          make
          bannertool makesmdh \
            -s "nbody3ds" -l "N-Body Gravitational Simulation" -p "phugen" \
            -i assets/nbody3ds.png -o nbody3ds.icn
          bannertool makebanner \
            -i assets/banner.png -a assets/banner.wav -o nbody3ds.bnr
          makerom -f cia -o nbody3ds.cia \
            -rsf assets/app.rsf -target t \
            -elf nbody3ds.elf \
            -icon nbody3ds.icn \
            -banner nbody3ds.bnr

      - uses: actions/upload-artifact@v5
        with:
          name: nbody3ds
          path: |
            nbody3ds.3dsx
            nbody3ds.smdh
            nbody3ds.cia

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: nbody3ds

      - name: Generate QR code
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode > /dev/null
          TAG="${GITHUB_REF#refs/tags/}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nbody3ds.cia"
          qrencode -o qrcode.png -s 6 -m 2 "$URL"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nbody3ds.3dsx
            nbody3ds.smdh
            nbody3ds.cia
            qrcode.png
          generate_release_notes: true

      - name: Add QR to release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXISTING="$(gh release view "$TAG" --json body -q .body)"
          QR_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/qrcode.png"
          printf '## Install via QR\n\nScan with FBI on your 3DS to install `nbody3ds.cia` directly.\n\n![QR Code](%s)\n\n---\n\n%s' "$QR_URL" "$EXISTING" > /tmp/body.md
          gh release edit "$TAG" --notes-file /tmp/body.md
