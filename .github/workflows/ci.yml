name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  APP_NAME: nbody3ds
  APP_TITLE: nbody3ds
  APP_DESCRIPTION: N-Body Gravitational Simulation
  APP_AUTHOR: phugen
  MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
  BANNERTOOL_URL: https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5
      - run: make
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}
          path: |
            ${{ env.APP_NAME }}.3dsx
            ${{ env.APP_NAME }}.smdh
            ${{ env.APP_NAME }}.elf
            assets/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.APP_NAME }}

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode > /dev/null
          wget -q "$MAKEROM_URL" -O /tmp/makerom.zip
          unzip -qo /tmp/makerom.zip -d /tmp/makerom
          sudo cp /tmp/makerom/makerom /usr/local/bin/
          wget -q "$BANNERTOOL_URL" -O /tmp/bannertool.zip
          unzip -qo /tmp/bannertool.zip "linux-x86_64/*" -d /tmp
          sudo cp /tmp/linux-x86_64/bannertool /usr/local/bin/
          sudo chmod +x /usr/local/bin/makerom /usr/local/bin/bannertool

      - name: Build CIA
        run: |
          bannertool makesmdh -s "$APP_TITLE" -l "$APP_DESCRIPTION" -p "$APP_AUTHOR" \
            -i assets/${{ env.APP_NAME }}.png -o ${{ env.APP_NAME }}.icn
          bannertool makebanner -i assets/banner.png -a assets/banner.wav \
            -o ${{ env.APP_NAME }}.bnr
          makerom -f cia -o ${{ env.APP_NAME }}.cia -rsf assets/app.rsf -target t \
            -elf ${{ env.APP_NAME }}.elf -icon ${{ env.APP_NAME }}.icn \
            -banner ${{ env.APP_NAME }}.bnr

      - name: Generate QR and release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CIA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${{ env.APP_NAME }}.cia"
          QR_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/qrcode.png"
          qrencode -o qrcode.png -s 6 -m 2 "$CIA_URL"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}.3dsx
            ${{ env.APP_NAME }}.smdh
            ${{ env.APP_NAME }}.cia
            qrcode.png
          generate_release_notes: true

      - name: Add QR to release body
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          QR_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/qrcode.png"
          EXISTING="$(gh release view "$TAG" --json body -q .body)"
          printf '## Install via QR\n\nScan with FBI to install `%s.cia` directly.\n\n![QR](%s)\n\n---\n\n%s' \
            "${{ env.APP_NAME }}" "$QR_URL" "$EXISTING" > /tmp/body.md
          gh release edit "$TAG" --notes-file /tmp/body.md
