name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make

      - uses: actions/upload-artifact@v5
        with:
          name: nbody3ds
          path: |
            nbody3ds.3dsx
            nbody3ds.smdh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: nbody3ds

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nbody3ds.3dsx
            nbody3ds.smdh
          generate_release_notes: true

      - name: Add QR code to release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode > /dev/null
          TAG="${GITHUB_REF#refs/tags/}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nbody3ds.3dsx"
          QR="$(qrencode -t UTF8 -m 1 "$URL")"
          EXISTING="$(gh release view "$TAG" --json body -q .body)"
          printf '## Install via QR\n\nScan with FBI on your 3DS to install `nbody3ds.3dsx` directly.\n\n```\n%s\n```\n\n---\n\n%s' "$QR" "$EXISTING" > /tmp/body.md
          gh release edit "$TAG" --notes-file /tmp/body.md
