name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make

      - uses: actions/upload-artifact@v5
        with:
          name: nbody3ds
          path: |
            nbody3ds.3dsx
            nbody3ds.smdh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: nbody3ds

      - name: Generate QR code
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode
          TAG="${GITHUB_REF#refs/tags/}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nbody3ds.3dsx"
          qrencode -o qrcode.png -s 6 -m 2 "$URL"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nbody3ds.3dsx
            nbody3ds.smdh
            qrcode.png
          generate_release_notes: true

      - name: Prepend QR to release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXISTING="$(gh release view "$TAG" --json body -q .body)"
          QR_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/qrcode.png"
          printf '## Install via QR\n\n![QR Code](%s)\n\nScan with FBI on your 3DS to install `nbody3ds.3dsx` directly.\n\n---\n\n%s' "$QR_URL" "$EXISTING" > /tmp/body.md
          gh release edit "$TAG" --notes-file /tmp/body.md
